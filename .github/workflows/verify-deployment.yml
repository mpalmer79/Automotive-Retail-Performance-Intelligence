# =============================================================================
# Verify the live deployment, from infrastructure that can reach it.
#
# WHY THIS WORKFLOW EXISTS SEPARATELY
# -----------------------------------
# `ci.yml` and `frontend.yml` are deliberately offline. CI has no reason to be
# on the internet, and a suite that reaches a live host would make every build
# depend on a platform nobody in this repository controls.
#
# But that left one question permanently unanswerable: does the deployed site
# actually serve what the repository says it serves? Every live field in
# `deployment/evidence/portfolio_deployment.json` read UNVERIFIED, and the
# environments the project is developed in are denied the deployment host, so
# the gap could not close from a developer machine either.
#
# This workflow closes it the only acceptable way: it runs the remote suite from
# a GitHub-hosted runner and records what came back. A person's report that the
# site loads is not admissible here, and neither is a green run of any other
# suite -- both were available before this workflow existed, and neither is
# evidence about the artefact a visitor receives.
#
# NO SECRET IS USED, AND NONE IS NEEDED. The only input is a public URL. This
# workflow reads a public website; it holds no Railway token, touches no
# database, and can provision nothing.
# =============================================================================

name: Verify deployment

on:
  # The intended way to run it: manually, against whichever URL is being checked.
  workflow_dispatch:
    inputs:
      base_url:
        description: "Public URL of the deployment to verify"
        required: true
        default: "https://arpi.up.railway.app"
        type: string
      # WHICH DEPLOYMENT THIS RUN IS ABOUT. Added by the `DASH.13` closeout.
      #
      # Before production was a supported target there was one deployment and the
      # question did not arise. Now a run against a public URL could be either, and
      # the recorder refuses to guess: a preview deployment has a public URL too,
      # and `arpi.up.railway.app` is one. The role is stated here and the recorder
      # checks it against what the deployment actually tells crawlers.
      deployment_role:
        description: "Whether this URL is the public production deployment or a preview"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      expected_commit:
        description: "Commit the deployment must be serving. Required for production; leave empty to compare the checked-out commit instead."
        required: false
        default: ""
        type: string

  # Also on a pull request that changes the deployment evidence, the remote suite
  # or this workflow -- the three things whose correctness cannot be judged
  # without running against the live site. Deliberately narrow: an ordinary
  # change must not reach out to a deployment.
  pull_request:
    paths:
      - ".github/workflows/verify-deployment.yml"
      - "deployment/evidence/**"
      - "portfolio/tests/remote/**"
      - "portfolio/playwright.remote.config.ts"
      - "scripts/record_deployment_evidence.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  remote-suite:
    name: Remote suite against the deployment
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # `inputs.base_url` is absent on a pull_request trigger, so the default is
      # named once here rather than repeated at every use.
      ARPI_REMOTE_BASE_URL: ${{ inputs.base_url || 'https://arpi.up.railway.app' }}
      # `preview` on the pull_request trigger, where no input exists. That trigger
      # only ever runs against the default URL, which is the preview deployment,
      # and defaulting the OTHER way would file it as production.
      ARPI_DEPLOYMENT_ROLE: ${{ inputs.deployment_role || 'preview' }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the website's dependencies
        working-directory: portfolio
        run: npm ci

      - name: Install Chromium for Playwright
        working-directory: portfolio
        run: npx playwright install --with-deps chromium

      # Reported before the suite runs, so a run against the wrong host is
      # obvious in the log rather than discovered in the evidence afterwards.
      - name: Report the target
        run: echo "Verifying ${ARPI_REMOTE_BASE_URL} as ${ARPI_DEPLOYMENT_ROLE}"

      # A production verification must name the commit it is about, because the
      # whole point of one is to prove production serves the release. Falling back
      # to `github.sha` would silently compare against whatever this workflow was
      # dispatched from, which on a production run is not necessarily the release.
      - name: Require an expected commit for a production verification
        if: inputs.deployment_role == 'production' && inputs.expected_commit == ''
        run: |
          echo "::error::expected_commit is required when deployment_role is production."
          echo "A production verification proves the deployment serves the release"
          echo "commit; without one there is nothing to compare it against."
          exit 1

      # `continue-on-error` so that a failing deployment still produces evidence.
      # A red suite is a finding worth recording precisely, not a reason to end
      # the job with nothing written; the recorder below fails the workflow if the
      # run was not clean.
      - name: Run the remote suite against the deployment
        id: remote
        continue-on-error: true
        working-directory: portfolio
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: remote-report.json
        run: |
          npx playwright test \
            --config playwright.remote.config.ts \
            --reporter=json,html,list

      # Every field this writes comes from a response or from the JSON report
      # above. A field it could not obtain keeps UNVERIFIED; nothing is inferred
      # from the suite's overall verdict.
      #
      # `--expect-commit` is the commit the suite was read from. The deployment
      # serves whichever commit was last deployed, which on a pull request is
      # never this one -- so a pull request that changes the routes the suite
      # targets would otherwise report the deployed build's behaviour as this
      # branch's failure. Named here, the recorder reports such a run and records
      # nothing, and still fails the job if the host does not answer at all.
      - name: Record what the run observed
        id: record
        env:
          # `expected_commit` when the caller named one -- which a production
          # verification must -- and otherwise the commit this tree is at.
          ARPI_TREE_COMMIT: ${{ inputs.expected_commit || github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/record_deployment_evidence.py \
            --base-url "${ARPI_REMOTE_BASE_URL}" \
            --role "${ARPI_DEPLOYMENT_ROLE}" \
            --report portfolio/remote-report.json \
            --expect-commit "${ARPI_TREE_COMMIT}" \
            --status-file "${GITHUB_OUTPUT}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      # Printed between markers so the recorded evidence can be read straight
      # from the job log, without downloading an artifact.
      - name: Print the recorded evidence
        if: always()
        run: |
          echo "----- ARPI-DEPLOYMENT-EVIDENCE-BEGIN -----"
          cat deployment/evidence/portfolio_deployment.json
          echo "----- ARPI-DEPLOYMENT-EVIDENCE-END -----"

      - name: Upload the evidence and the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-verification
          path: |
            deployment/evidence/portfolio_deployment.json
            portfolio/remote-report.json
            portfolio/playwright-report-remote/
          retention-days: 30

      # The recorder already failed the job on an incomplete verification. This
      # step makes a red SUITE fail it too, so a deployment that regressed cannot
      # be recorded as verified merely because the recorder wrote a file.
      #
      # Gated on `admissible`, which the recorder emitted above. A red suite is a
      # verdict only when the deployment was serving the commit the suite was read
      # from; otherwise the assertions were written for a build that is not out
      # there, and the recorder has already said so and written nothing. The
      # comparison is not repeated here -- a second implementation of it could
      # disagree with the recorder, and then the job's verdict and the register's
      # would part company.
      - name: Fail if the suite did not pass
        if: steps.remote.outcome != 'success' && steps.record.outputs.admissible == 'true'
        run: |
          echo "The remote suite did not pass against the commit it was read from."
          echo "The evidence file records the real result; do not edit it by hand"
          echo "to make this green."
          exit 1

      # Said out loud rather than left as a silently skipped step, because a run
      # that verified nothing must not read like a run that verified everything.
      - name: Report a run that could not be about this tree
        if: steps.record.outputs.admissible != 'true'
        run: |
          echo "This run did not verify this commit: the deployment is serving a"
          echo "different one. Nothing was recorded, and the suite's route-level"
          echo "results describe the deployed build rather than this branch."
