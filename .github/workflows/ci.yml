# =============================================================================
# Automotive Retail Performance Intelligence (ARPI) — continuous integration
# =============================================================================
# NO SECRETS RULE
# ---------------
# This workflow must run to completion on a fork, with zero repository secrets
# configured. It never touches a hosted database, a cloud account, Power BI
# Service, or any external service. The only credential that appears anywhere in
# this file is the throwaway password of a PostgreSQL container that lives and
# dies inside a single job. If a future change here needs `secrets.*`, that is a
# signal the change belongs somewhere other than CI.
#
# JOBS
# ----
#   quality             formatting, lint, types, unit and data-quality tests
#   floor               the minimum supported dependency versions still work
#   database-setup-image  builds the Railway provisioning image AND rehearses the
#                       provisioning run twice against Railway's postgres-ssl image
#   repository-checks   naming, documentation links, secret safety net,
#                       Power BI model structure, real-engine validation evidence
#   deployment-tooling  Railway deployment specification, IaC declaration and the
#                       tooling's own tests — all offline, no credential
#   integration         PostgreSQL DDL + integration tests against a container
#
# The Power BI checks in `repository-checks` read the PBIP project's TMDL and
# JSON as text and compare a hash. NONE OF THEM LAUNCHES OR CONTACTS A SEMANTIC
# MODEL ENGINE, and nothing in this workflow ever may. Power BI Desktop is a
# Windows application; Microsoft Fabric needs a tenant, a workspace and a cloud
# PostgreSQL database. A refresh needs a loaded `reporting` schema. Both engines'
# results are produced outside CI and recorded in
# `powerbi/validation/desktop_validation_results.json` and
# `powerbi/validation/fabric_validation_results.json`, and ADR-0008 governs what
# either of them has to prove.
#
# `quality` and `repository-checks` are the gate for every change.
# `integration` is deliberately a separate job so that a PostgreSQL service
# hiccup is visually distinguishable from a genuine code failure.
# =============================================================================

name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

# Superseded runs on the same ref are cancelled; the newest push is the one that
# matters and runner minutes are finite.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. No job here writes to the repository, publishes a
# package, or comments on a pull request.
permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  # ---------------------------------------------------------------------------
  # 1. quality — the authoritative gate for Python source and tests.
  #    Runs exactly the commands documented in CONTRIBUTING.md, in the same
  #    order, so a green local run predicts a green CI run.
  # ---------------------------------------------------------------------------
  quality:
    name: Quality (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Do not cancel 3.12 because 3.11 failed; seeing both results is the point
      # of the matrix.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # `pyproject.toml` remains the declaration of SUPPORTED RANGES. `uv.lock` is
      # the REVIEWED RESOLUTION of those ranges, and it is what CI, a developer and
      # the Railway provisioning image all install. The distinction matters: the
      # ranges say what the project claims to work with, the lock says what was
      # actually tested.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Fails when `uv.lock` no longer satisfies `pyproject.toml` -- for instance
      # when a dependency was added or a bound changed without relocking. It does
      # NOT regenerate the lock: a CI job that silently relocks defeats the point of
      # having one, because the resolution nobody reviewed is the one that ships.
      - name: Verify the lock is current
        run: uv lock --check

      # `--frozen` installs the lock exactly and refuses to resolve anything. A
      # network hiccup or a newly published version cannot change what this job runs.
      - name: Install from the frozen lock
        run: uv sync --frozen --all-extras

      - name: Report the resolved toolchain
        run: |
          uv --version
          uv run python --version
          uv run ruff --version
          uv run mypy --version
          uv run pytest --version
          uv run python -c "import pandas, pydantic; print('pandas', pandas.__version__, 'pydantic', pydantic.__version__)"

      # Formatting first: a formatting failure is the cheapest to fix and would
      # otherwise create noise in the lint output.
      - name: Check formatting (ruff format)
        run: uv run ruff format --check .

      # `--output-format=github` turns findings into inline annotations on the
      # pull-request diff.
      - name: Lint (ruff check)
        run: uv run ruff check --output-format=github .

      - name: Type-check (mypy)
        run: uv run mypy src tests

      # Integration tests are excluded here; they need PostgreSQL and run in the
      # dedicated job below.
      - name: Run unit and data-quality tests with coverage
        run: |
          uv run pytest -m "not integration" \
            --cov=arpi \
            --cov-report=term-missing \
            --cov-report=xml

      # The step above already runs the whole non-integration suite in ONE process,
      # which is what makes cross-test state leakage visible at all. It is not
      # sufficient on its own: it fixes ONE order, so a leak that only matters in a
      # different order stays hidden.
      #
      # `configure_logging` sets the level and `propagate = False` on the process-global
      # `arpi` logger. Before `tests/conftest.py` grew `_isolated_logging`, that state
      # survived the test that caused it, and a later `caplog` assertion saw an empty
      # `caplog.text`. The same test passed alone and failed after `test_cli.py`.
      #
      # These two runs pin that down: the first is the order that actually failed, the
      # second is its reverse. Both are deterministic and cost a few seconds, so neither
      # needs a random-order plugin -- which would trade reproducibility for coverage of
      # orders nobody has seen fail.
      - name: Run the logging-sensitive modules in the order that used to fail
        run: |
          uv run pytest -p no:randomly --no-cov -q \
            tests/unit/test_logging_config.py \
            tests/unit/test_cli.py \
            tests/unit/test_ingestion.py \
            tests/unit/test_logging_isolation.py

      - name: Run the same modules in the reverse order
        run: |
          uv run pytest -p no:randomly --no-cov -q \
            tests/unit/test_logging_isolation.py \
            tests/unit/test_ingestion.py \
            tests/unit/test_cli.py \
            tests/unit/test_logging_config.py

      - name: Upload the coverage report
        # Upload even when the tests failed; the partial report is often the
        # fastest way to see what regressed.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 1b. floor — the project at the MINIMUM dependency versions it claims to support.
  #
  #     `pyproject.toml` declares ranges such as `pandas>=2.2`. The lock pins the
  #     top of those ranges, so without this job the lower bound is an untested
  #     assertion: CI would prove the project works with one resolution and claim
  #     it works with an interval.
  #
  #     That gap was not hypothetical. `DQ-EMP-003` evaluated
  #     `Timestamp("9999-12-31") + Timedelta(days=1)`, which raises
  #     `OutOfBoundsDatetime` on pandas 2.2 and silently widens on pandas 3.0. CI
  #     was green on 3.0 while a supported floor crashed a gating validator. This
  #     job is what makes `>=2.2` mean something.
  #
  #     One job, one interpreter, no coverage, non-integration only -- a couple of
  #     minutes, rather than doubling the matrix.
  # ---------------------------------------------------------------------------
  floor:
    name: Minimum supported dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The declared floor of `requires-python`. Resolving lowest-direct on a newer
      # interpreter would silently raise the floor, because old releases have no
      # wheels for it.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      # `lowest-direct` pins the DIRECT dependencies to their declared minimums and
      # lets transitives resolve normally. Full `lowest` would also drag every
      # transitive to its floor, which tests the ecosystem's history rather than
      # this project's declaration.
      #
      # Deliberately NOT `--frozen`: the whole point is to resolve something other
      # than the lock.
      - name: Install the declared minimum versions
        run: uv sync --resolution lowest-direct --all-extras

      # pandas 2.2 emits a DeprecationWarning at import asking for pyarrow, and
      # `filterwarnings = ["error"]` turns it into a collection error. Installing
      # what pandas asks for keeps this job's warning strictness identical to the
      # main gate -- the alternative, relaxing `filterwarnings` here, would mean the
      # floor job tested less than the job it is meant to backstop. pyarrow is not
      # an ARPI dependency and is not in the lock.
      - name: Satisfy pandas 2.2's pyarrow deprecation notice
        run: uv pip install pyarrow

      - name: Report the resolved floor
        run: |
          uv run python --version
          uv run python -c "import pandas, pydantic; print('pandas', pandas.__version__, 'pydantic', pydantic.__version__)"

      # Lint and types are deliberately absent: ruff 0.6 and mypy 1.10 disagree
      # with current versions about formatting and inference, and pinning the source
      # to satisfy both would mean writing to the older tool. Behaviour is what the
      # floor has to preserve, so behaviour is what is asserted.
      - name: Run unit and data-quality tests at the floor
        run: uv run pytest -m "not integration" -q --no-cov

  # ---------------------------------------------------------------------------
  # 1c. database-setup-image — the Railway provisioning image actually builds.
  #
  #     `frontend.yml` builds `portfolio/Dockerfile.railway`, the WEBSITE image.
  #     Nothing built `deployment/railway/Dockerfile.database-setup`, so a change to
  #     the image that loads the database was only discovered by deploying it.
  #
  #     That matters more now that the image installs `uv sync --frozen`: the whole
  #     point of the lock is that Railway and CI install the same graph, and an
  #     assertion nobody executes is not evidence.
  #
  #     It also REHEARSES the run. Building the image proves it can start; it does
  #     not prove `provision_database.sh` reaches the end, and the difference was not
  #     academic. Two defects lived in that script until a rehearsal was performed:
  #     `$$` inside a double-quoted shell string is the shell's process ID, not a
  #     dollar-quote, so the bootstrap-role probe compared `true1true` against a
  #     `*/true` pattern and aborted every run before a single schema was created,
  #     and the same mistake in the reconciliation report was swallowed by its own
  #     `|| printf 'unavailable'` fallback. Neither is visible in a build, in a type
  #     check, or in a review; both are unmissable the first time the script is run.
  #
  #     The rehearsal is deliberately NOT the integration job's `postgres:16` service
  #     container. That container has no TLS, and the script asserts an encrypted
  #     session from `pg_stat_ssl` before it will create a credential — so the one
  #     property this job exists to rehearse is the one that container cannot
  #     provide. It runs against `ghcr.io/railwayapp-templates/postgres-ssl`, the
  #     image `deployment/railway/project.config.json` declares Railway will run.
  #
  #     STILL NO SECRETS. The database is a throwaway container on a job-local
  #     network, and its credential is a literal for the same reason the integration
  #     job's is: putting it in `secrets.*` would imply it protects something and
  #     would stop this workflow running on a fork.
  # ---------------------------------------------------------------------------
  database-setup-image:
    name: Railway database-setup image
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Repository root as the context, matching the Dockerfile's own header and
      # what Railway does.
      - name: Build the provisioning image
        run: |
          docker build \
            --file deployment/railway/Dockerfile.database-setup \
            --tag arpi-database-setup:ci \
            .

      # A build that succeeds and produces an image the entry point cannot run is
      # not a passing build. These are the four things `provision_database.sh`
      # depends on.
      - name: Assert the image contract
        run: |
          docker run --rm --entrypoint sh arpi-database-setup:ci -c '
            set -eux
            arpi --version
            python -c "import pandas, psycopg, pydantic, yaml"
            psql --version
            test -f uv.lock
            test -x ./provision_database.sh
            # The run GENERATES the profile to data/raw/<profile>/ before loading
            # it, and logs to logs/. Both are relative to the working directory,
            # which WORKDIR creates as root while the image runs as `arpi`. Asserted
            # as a writability check rather than as an ownership one, because what
            # the run needs is the ability to write, however that is arranged.
            test -w ./data
            test -w ./logs
          '

      # The reason the image was changed at all: it must install what the lock says,
      # not whatever the index served at build time.
      - name: Assert the image installed the locked versions
        run: |
          locked=$(python - <<'PY'
          import re, pathlib
          text = pathlib.Path("uv.lock").read_text()
          found = dict(re.findall(r'\[\[package\]\]\nname = "([^"]+)"\nversion = "([^"]+)"', text))
          print(found["pandas"], found["psycopg"], found["pydantic"])
          PY
          )
          built=$(docker run --rm --entrypoint python arpi-database-setup:ci -c \
            'import pandas, psycopg, pydantic; print(pandas.__version__, psycopg.__version__, pydantic.__version__)')
          echo "lock:  $locked"
          echo "image: $built"
          test "$locked" = "$built"

      # -----------------------------------------------------------------------
      # The rehearsal.
      #
      # The PostgreSQL image is read from project.config.json rather than written
      # here, so this job cannot rehearse against an image Railway does not run.
      # -----------------------------------------------------------------------
      # `docker run -d` returns as soon as the container is CREATED, so this step
      # succeeding says nothing about whether PostgreSQL ever started. It is
      # therefore followed by an explicit readiness gate rather than by the
      # provisioning run — the first attempt at this job had no gate, the database
      # never came up, and the only symptom was the provisioning script's own
      # five-minute timeout with the container's logs nowhere in the output.
      # BOTH the image and the volume mount path come from project.config.json,
      # so this job cannot rehearse against an image Railway does not run or a
      # layout Railway does not use.
      #
      # The mount path is not decoration. This image refuses to start unless
      # `PGDATA` lies under it:
      #
      #   PGDATA variable does not start with the expected volume mount path,
      #   expected to start with /var/lib/postgresql/data
      #
      # — because on Railway that path is where the persistent volume is mounted,
      # and a PGDATA outside it would put the database on the container's
      # ephemeral filesystem, silently, and lose it on the next deploy. The
      # official postgres:18 base image moved its default PGDATA out of that
      # directory, so the wrapper's guard fires on a plain `docker run`. Supplying
      # the volume and the PGDATA is supplying exactly what Railway supplies.
      #
      # PGDATA is a SUBDIRECTORY of the mount rather than the mount itself, which
      # is the usual arrangement for a mounted volume: initdb wants an empty
      # directory, and a volume root is not reliably one.
      - name: Start the PostgreSQL image the deployment declares
        run: |
          set -euo pipefail
          config=deployment/railway/project.config.json
          prefix=$(python -c "import json,sys;print(json.load(open('$config'))['services']['postgres']['expectedImagePrefix'])")
          mount=$(python -c "import json,sys;print(json.load(open('$config'))['services']['postgres']['volume']['mountPath'])")
          echo "POSTGRES_IMAGE=${prefix}:18" >> "$GITHUB_ENV"
          echo "Image: ${prefix}:18   volume mount: ${mount}"

          docker network create arpi-rehearsal
          docker volume create arpi-rehearsal-data
          # THROWAWAY CI-ONLY CONTAINER CREDENTIAL — NOT A SECRET. It exists for
          # the lifetime of one job, on a container reachable only from that job.
          docker run -d --name arpi-postgres --network arpi-rehearsal \
            -v arpi-rehearsal-data:"${mount}" \
            -e PGDATA="${mount}/pgdata" \
            -e POSTGRES_PASSWORD=rehearsal \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_DB=railway \
            "${prefix}:18"

      # Two probes, because they fail for different reasons and the difference is
      # the diagnosis:
      #
      #   `docker exec ... pg_isready`   the server itself, with no network in the
      #                                  way. Fails => the image did not start.
      #   `pg_isready -h arpi-postgres`  from another container on the same
      #                                  network, which is what the provisioning
      #                                  job does. Fails while the first passes
      #                                  => Docker DNS or the network, not the
      #                                  database.
      #
      # Bounded at 120s. The server needs seconds; a minute of failure means it is
      # not coming, and waiting the provisioning script's full five minutes only
      # delays the same answer.
      - name: Wait for PostgreSQL, and say why if it never comes
        run: |
          set -uo pipefail
          ready=""
          for _ in $(seq 1 60); do
            if docker exec arpi-postgres pg_isready -q -U postgres -d railway 2>/dev/null; then
              ready=yes
              break
            fi
            sleep 2
          done

          if [ -z "$ready" ]; then
            echo "::group::docker ps -a"
            docker ps -a
            echo "::endgroup::"
            echo "::group::docker inspect state"
            docker inspect --format '{{json .State}}' arpi-postgres || true
            echo "::endgroup::"
            echo "::group::docker logs arpi-postgres"
            docker logs arpi-postgres 2>&1 | tail -100 || true
            echo "::endgroup::"
            echo "::error title=Rehearsal database never started::${POSTGRES_IMAGE} did not accept connections within 120s. Its logs are above."
            exit 1
          fi
          echo "PostgreSQL is accepting connections inside the container."

          # Now the same question from where the provisioning job will ask it.
          if ! docker run --rm --network arpi-rehearsal --entrypoint pg_isready \
                 arpi-database-setup:ci -q -h arpi-postgres -p 5432 -U postgres -d railway; then
            echo "::group::docker network inspect"
            docker network inspect arpi-rehearsal || true
            echo "::endgroup::"
            echo "::error title=Rehearsal database unreachable across the network::PostgreSQL is up inside its container but not reachable as 'arpi-postgres' from another container on arpi-rehearsal."
            exit 1
          fi
          echo "PostgreSQL is reachable as arpi-postgres from the provisioning image."

          # The point of using Railway's postgres-ssl image rather than a plain
          # postgres container: the provisioning script refuses to create a
          # credential over an unencrypted session, so TLS must be on before the
          # rehearsal is worth running at all.
          docker exec arpi-postgres psql -U postgres -d railway -tAc 'SHOW ssl' | grep -qx on || {
            echo "::error title=TLS is not enabled::${POSTGRES_IMAGE} started without SSL, so the provisioning script's encryption assertion cannot be rehearsed."
            exit 1
          }
          echo "TLS is enabled on the rehearsal database."

      # One definition of "what is in the warehouse", used after each load and
      # again after the restart. Written once rather than three times, because
      # three copies of a count query are three chances for the comparison to be
      # between two different questions.
      #
      # Real counts, not pg_stat_user_tables — its n_live_tup is an estimate
      # maintained by autovacuum and can lag a load that just finished.
      - name: Prepare the warehouse count probe
        run: |
          set -euo pipefail
          cat > warehouse_counts.sql <<'SQL'
          SELECT string_agg(t.name || '=' || t.rows, E'\n' ORDER BY t.name)
          FROM (
            SELECT c.relname AS name,
                   (xpath('/row/c/text()',
                          query_to_xml(format('SELECT count(*) AS c FROM warehouse.%I',
                                              c.relname), false, true, '')))[1]::text::bigint AS rows
            FROM pg_class AS c
            JOIN pg_namespace AS n ON n.oid = c.relnamespace
            WHERE n.nspname = 'warehouse' AND c.relkind = 'r'
          ) AS t;
          SQL
          cat > count_warehouse.sh <<'SH'
          #!/bin/sh
          # $1 = file to write "table=rows" lines into.
          set -eu
          docker run --rm --network arpi-rehearsal \
            -v "$PWD/warehouse_counts.sql:/probe.sql:ro" \
            -e PGPASSWORD=rehearsal --entrypoint psql arpi-database-setup:ci \
            -h arpi-postgres -U postgres -d railway -tA -f /probe.sql > "$1"
          SH
          chmod +x count_warehouse.sh

      # Twice, on purpose. deployment/railway/README.md section 6 states the run is
      # safe to repeat, and section 8's password rotation depends on it: step 2 is a
      # redeploy of this job. A rerun that fails makes both procedures unrunnable,
      # which is precisely what the verifier's fixed audit-history expectations did
      # until they were re-expressed per run.
      #
      # `--network` puts the job on the same network as the database, the way
      # Railway's private network does. The two role passwords are generated here
      # and never printed, mirroring Railway's server-side generators.
      #
      # They are passed to `docker run` as `-e NAME` — the PASS-THROUGH form, which
      # takes the value from this step's own environment — rather than as
      # `-e NAME=value`. A value written into the argument list is visible in `ps`
      # on the runner and in the command echo, which is the same rule
      # `provision_database.sh` follows when it feeds psql on stdin.
      - name: Rehearse the provisioning run, twice
        env:
          ARPI_PROFILE: development
        run: |
          set -euo pipefail
          ARPI_PIPELINE_PASSWORD=$(python -c "import secrets;print(secrets.token_urlsafe(36))")
          ARPI_FABRIC_PASSWORD=$(python -c "import secrets;print(secrets.token_urlsafe(36))")
          export ARPI_PIPELINE_PASSWORD ARPI_FABRIC_PASSWORD
          for run in 1 2; do
            echo "::group::provisioning run ${run}"
            docker run --rm --network arpi-rehearsal \
              -e PGHOST=arpi-postgres -e PGPORT=5432 -e PGDATABASE=railway \
              -e PGUSER=postgres -e PGPASSWORD=rehearsal \
              -e ARPI_PIPELINE_PASSWORD \
              -e ARPI_FABRIC_PASSWORD \
              -e ARPI_PROFILE \
              arpi-database-setup:ci > "run${run}.log" 2>&1 || {
                tail -40 "run${run}.log"
                echo "::error title=Provisioning rehearsal failed::Run ${run} did not complete."
                exit 1
              }
            tail -30 "run${run}.log"
            echo "::endgroup::"

            # The two role passwords must not reach the deploy log. This is the
            # assertion the script's "NO PASSWORD IS EVER PRINTED" header makes.
            if grep -qF "$ARPI_PIPELINE_PASSWORD" "run${run}.log" || grep -qF "$ARPI_FABRIC_PASSWORD" "run${run}.log"; then
              echo "::error title=Credential leaked::A generated password appeared in the run output."
              exit 1
            fi

            # `unavailable` here is the reconciliation report failing silently — the
            # second of the two defects this rehearsal was added to catch.
            if grep -q 'reconciliations  *: unavailable' "run${run}.log"; then
              echo "::error title=Reconciliation report unavailable::The reconciliation query failed and was swallowed."
              exit 1
            fi

            ./count_warehouse.sh "counts${run}.txt"
            echo "warehouse after run ${run}:"
            cat "counts${run}.txt"
          done

      # The warehouse is deterministic at seed 20250701, so a second load must leave
      # every warehouse count exactly where the first one put it. Only the
      # append-only audit layer may grow.
      - name: Assert the warehouse is complete and the reload changed nothing
        run: |
          set -euo pipefail

          if ! diff -u counts1.txt counts2.txt; then
            echo "::error title=Reload was not deterministic::The second load changed a warehouse row count."
            exit 1
          fi

          # Eight conformed dimensions and five MVP facts, each holding rows.
          expected="dim_customer dim_date dim_dealership dim_employee dim_lead_source
                    dim_marketing_campaign dim_vehicle dim_vehicle_model
                    fact_appointment fact_lead fact_marketing_spend
                    fact_vehicle_inventory_snapshot fact_vehicle_sale"
          for table in $expected; do
            line=$(grep "^${table}=" counts1.txt || true)
            if [ -z "$line" ]; then
              echo "::error title=Missing warehouse table::${table} does not exist."
              exit 1
            fi
            if [ "${line#*=}" = "0" ]; then
              echo "::error title=Empty warehouse table::${table} exists but holds no rows."
              exit 1
            fi
          done
          echo "13 of 13 warehouse tables present and populated, stable across two loads."

      # Volume persistence, which is otherwise an untestable claim about Railway.
      #
      # The database now runs with a real Docker volume mounted at the path
      # project.config.json declares Railway mounts one at, so "the data survives a
      # restart of the database service" can be asked here rather than asserted in
      # prose. A PGDATA that had ended up on the container filesystem would pass
      # every other check in this job and fail this one — which is precisely the
      # mistake the image's own PGDATA guard exists to prevent.
      - name: Assert the data survives a database restart
        run: |
          set -uo pipefail
          docker restart arpi-postgres

          ready=""
          for _ in $(seq 1 60); do
            if docker exec arpi-postgres pg_isready -q -U postgres -d railway 2>/dev/null; then
              ready=yes
              break
            fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            docker logs arpi-postgres 2>&1 | tail -50 || true
            echo "::error title=Database did not come back::PostgreSQL did not restart within 120s."
            exit 1
          fi

          ./count_warehouse.sh counts-after-restart.txt || exit 1
          if ! diff -u counts2.txt counts-after-restart.txt; then
            echo "::error title=Data did not survive the restart::The warehouse changed across a restart, so PGDATA is not on the mounted volume."
            exit 1
          fi
          echo "Warehouse identical after restart: the data is on the volume, not the container filesystem."

      # The volume outlives `docker rm` by design, so it is removed explicitly.
      - name: Stop the rehearsal database
        if: always()
        run: |
          docker rm -f arpi-postgres || true
          docker volume rm arpi-rehearsal-data || true

  # ---------------------------------------------------------------------------
  # 2. repository-checks — repository hygiene, not code correctness.
  #    Every script here is standard library only and is run WITHOUT installing
  #    the package, which keeps this job to a few seconds.
  # ---------------------------------------------------------------------------
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # check_secrets.py inspects the git index, so a shallow checkout with
          # full file listing is enough; history is not needed.
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Fails if the retired project name is used as a current identity.
      # ADR-0001 is the decision this enforces.
      - name: Naming consistency
        run: python scripts/check_naming.py

      # Fails on a broken relative Markdown link or an unresolvable heading
      # anchor. External links are not fetched; CI has no reason to be online.
      - name: Documentation links
        run: python scripts/check_docs_links.py

      # A safety net, not a real secret scanner. See the module docstring and
      # SECURITY.md for what it does and does not cover.
      - name: Secret safety net
        run: python scripts/check_secrets.py

      # ADR-0011 admits ONE lane of committed data that is not synthetic: sanitized
      # public dealership listing snapshots under data/reference/. Everything that makes
      # that safe is a property of the committed file rather than of the code that wrote
      # it, so it has to be checked where the file is -- here.
      #
      # This step fails on an artifact the contract does not declare, a declared
      # artifact that is missing, a canonical file name that does not match the approved
      # pattern, a content digest that does not match the declaration, a duplicate of a
      # workbook under a second path, a workbook filed under another store's directory,
      # a non-synthetic file appearing under data/sample/, and -- reading the workbook
      # itself as a ZIP of XML, with no dependency installed -- a source URL or a
      # real-looking VIN inside committed reference data.
      #
      # It also fails a DOCUMENT that describes this lane as fully synthetic, that reads
      # a removed listing as a sale, or that reads days observed online as days in
      # stock. Those three are the claims the lane can most plausibly be mistaken for,
      # and prose is where the mistake would actually be made.
      #
      # Standard library only, like every other step in this job: the workbook reader is
      # zipfile plus the XML the spreadsheet already is.
      - name: Reference-data governance
        run: python scripts/check_reference_data.py

      # Fails when the semantic model departs from the register in
      # powerbi/model_documentation/ -- a table, relationship, hidden column or
      # measure that the specification does not describe, a bidirectional
      # filter, a schema other than `reporting`, or a PII-bearing column. It
      # parses TMDL as text; POWER BI DESKTOP IS NEVER LAUNCHED.
      - name: Power BI model structure
        run: python scripts/check_powerbi_model.py

      # Implementation status lived only in prose, in several documents written at
      # different times, and prose does not fail a build when it goes stale. It went
      # stale in ten places: documents denying that the semantic model source existed
      # while thirty TMDL files sat beside them, and denying that any DAX had been
      # written while forty-nine measures were declared. These two steps make that class
      # of drift a build failure.
      #
      # This comment paraphrases those claims rather than quoting them, because the
      # check searches every tracked text file including this one -- which is a fair
      # demonstration that it works.
      #
      # The check compares DECLARED status (config/project_capabilities.json) and
      # DOCUMENTED prose against DERIVED evidence read from the repository, in both
      # directions. Every rule only ever tightens a claim toward the evidence: none can
      # open a gate, pass a validation or promote a phase because a file appeared.
      #
      # It also holds the THREE DEPLOYMENTS apart -- the portfolio website, the
      # analytical platform, and the semantic model -- against
      # deployment/evidence/portfolio_deployment.json. That file records identifiers
      # only, never a credential, and this step fails when a key in it names a token, a
      # password or a database URL. It equally fails a deployment status asserted
      # without an evidence record, and a document that denies a deployment the evidence
      # records: the website went live while three governing documents still said no
      # deployment existed, and nothing caught it.
      #
      # NOTHING HERE CONTACTS THE DEPLOYMENT. CI has no reason to be online, so every
      # live field reads UNVERIFIED and is never rendered as a pass.
      - name: Capability and deployment-evidence consistency
        run: python scripts/check_project_capabilities.py

      # Regenerates the marked capability blocks in memory and compares. A count that
      # moved without the documents being regenerated fails here rather than shipping.
      - name: Generated capability blocks are current
        run: python scripts/generate_project_capabilities.py --check

      # ADR-0008 accepts TWO real-engine validation paths -- Power BI Desktop
      # and Microsoft Fabric -- with an identical proof obligation. Each engine
      # reports one of five states: PASSED, PENDING, STALE, FAILED, MISSING.
      # STALE and FAILED block on every branch, because a stale pass is more
      # dangerous than no pass: it reads as validated while describing a model
      # that no longer exists. PENDING exits zero so a branch can be worked on
      # before an engine has run -- it is never rendered as a pass.
      #
      # NOTHING HERE LAUNCHES OR CONTACTS AN ENGINE. Power BI Desktop is a
      # Windows application and Microsoft Fabric needs a tenant, a workspace and
      # a cloud database; a GitHub runner has none of those. These steps read
      # evidence files and compare a hash, and that is all they can ever do.
      - name: Real-engine validation evidence (Power BI Desktop)
        run: python scripts/check_desktop_validation_freshness.py

      - name: Real-engine validation evidence (Microsoft Fabric)
        run: python scripts/check_fabric_validation_freshness.py

      # The gate itself. Either engine passing satisfies it; static validation
      # alone never does.
      #
      # `--require-pass` is DELIBERATELY NOT SET YET. Turning it on before any
      # passing real-engine evidence exists would break the branch for a
      # condition nobody can currently clear, which teaches people to bypass the
      # check rather than to satisfy it. The flag goes on in the same change
      # that lands the first passing evidence -- see `P2.1-14` in
      # docs/requirements/PHASE_2_BACKLOG.md. Until then this step reports
      # PENDING honestly and exits zero.
      - name: Real-engine validation gate (ADR-0008)
        run: python scripts/check_real_engine_validation.py


  # ---------------------------------------------------------------------------
  # 4. deployment-tooling — the Railway deployment, checked without Railway.
  #
  #    NO CREDENTIAL, NO NETWORK, AND THEREFORE NO EXCEPTION TO THE NO-SECRETS
  #    RULE. Everything here is a statement about source-controlled files:
  #
  #      * the deployment specification is internally consistent, agrees with
  #        railway.json, targets a non-production environment, and contains no
  #        credential
  #      * `.railway/railway.ts` compiles, through the Railway SDK's own runner,
  #        into the resource graph the specification describes — with references
  #        where references are required, server-side generators where passwords
  #        are required, and no literal credential anywhere
  #      * the tooling's own tests pass, including the bootstrap tool's behaviour
  #        against a fake Railway CLI: that a dry run issues no mutating command,
  #        that a converged project is not re-created, and that the token never
  #        reaches a command line
  #
  #    The one thing needing a credential — reading the LIVE project — lives in
  #    `railway-bootstrap.yml`, which is `workflow_dispatch` only.
  # ---------------------------------------------------------------------------
  deployment-tooling:
    name: Deployment tooling
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install the deployment tooling
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # No runtime dependencies exist in this package — every one is development
      # tooling that never ships — so both audits are run and both must be clean.
      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Validate the deployment specification
        run: npm run spec:validate

      - name: Evaluate the Railway declaration
        run: npm run iac:evaluate

      - name: Deployment tooling tests
        run: npm test

  # ---------------------------------------------------------------------------
  # 3. integration — SQL objects and database-backed tests.
  #    Kept separate on purpose: if this job is red and `quality` is green, the
  #    problem is the database layer or the service container, not the Python
  #    package.
  #
  #    The job SKIPS GRACEFULLY (green, with a notice) when `sql/` or
  #    `tests/integration/` is absent, so early-phase branches are not blocked
  #    by infrastructure that does not exist yet.
  # ---------------------------------------------------------------------------
  integration:
    name: Integration (PostgreSQL 16)
    runs-on: ubuntu-latest
    continue-on-error: false

    services:
      postgres:
        image: postgres:16
        env:
          # THROWAWAY CI-ONLY CONTAINER CREDENTIAL — NOT A SECRET.
          # This password exists for the lifetime of one job, on a container
          # reachable only from that job's network namespace. It is written as a
          # literal on purpose: putting it in `secrets.*` would imply it protects
          # something, and would stop this workflow from running on forks.
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: arpi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arpi -h localhost -p 5432"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # ARPI configuration overrides (see the configuration contract: `ARPI_`
      # prefix, `__` nested delimiter, password never in YAML).
      ARPI_PROFILE: test
      ARPI_DATABASE__ENABLED: "true"
      ARPI_DATABASE__HOST: localhost
      ARPI_DATABASE__PORT: "5432"
      ARPI_DATABASE__NAME: arpi
      ARPI_DATABASE__USER: postgres
      ARPI_DATABASE__PASSWORD: postgres
      ARPI_DATABASE__SSLMODE: disable
      # libpq equivalents so `psql` and any direct psycopg connection agree.
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: arpi
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Guard: decide once whether there is anything to do, and reuse the answer.
      - name: Decide whether the database layer exists yet
        id: guard
        run: |
          sql_count=$(find sql -name '*.sql' -type f 2>/dev/null | wc -l)
          if [ ! -d sql ] || [ "$sql_count" -eq 0 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Integration skipped::No SQL scripts found under sql/."
            exit 0
          fi
          if [ ! -d tests/integration ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Integration skipped::tests/integration/ does not exist."
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "Found $sql_count SQL script(s)."

      - name: Set up Python 3.11
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        if: steps.guard.outputs.run == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Same frozen lock as the quality job, so an integration failure can never be
      # explained by the two jobs having resolved different dependency graphs.
      - name: Install from the frozen lock
        if: steps.guard.outputs.run == 'true'
        run: uv sync --frozen --all-extras

      - name: Ensure the psql client is available
        if: steps.guard.outputs.run == 'true'
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql --version

      - name: Wait for the PostgreSQL service container
        if: steps.guard.outputs.run == 'true'
        run: |
          for attempt in $(seq 1 30); do
            if pg_isready -q; then
              echo "PostgreSQL is accepting connections (attempt $attempt)."
              exit 0
            fi
            sleep 2
          done
          echo "::error title=PostgreSQL unavailable::The service container never became ready."
          exit 1

      # The SQL tree is numbered so that lexical order is execution order:
      # 00_database -> 01_raw -> 02_staging -> 03_dimensions -> ... -> 08_validation.
      #
      # This is the 25-step sequence defined in sql/README.md section 2, and it is
      # the same sequence tests/integration/conftest.py builds:
      #   * the glob is `sql/0*/*.sql`, which cannot match `sql/99_local_reset.sql`
      #     — that script DROPs every ARPI schema and must never run here;
      #   * `07_security/02_role_verification.sql` is a read-only operator report,
      #     not a build step, so it is skipped;
      #   * `07_security/01_grants.sql` runs a second time as step 25, because the
      #     objects created by 08_validation would otherwise stay owned by the
      #     bootstrap role instead of arpi_admin.
      - name: Run the ordered SQL initialisation sequence
        if: steps.guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          find sql/0* -name '*.sql' -type f \
            ! -path 'sql/07_security/02_role_verification.sql' \
            | LC_ALL=C sort > /tmp/arpi_sql_sequence.txt
          echo 'sql/07_security/01_grants.sql' >> /tmp/arpi_sql_sequence.txt
          while read -r script; do
            echo "::group::$script"
            psql -v ON_ERROR_STOP=1 --quiet --no-psqlrc -f "$script"
            echo "::endgroup::"
          done < /tmp/arpi_sql_sequence.txt

      # `--no-cov` disables the coverage plugin that pyproject.toml enables by
      # default. The integration subset exercises SQL, not the whole package, so
      # measuring it against the project-wide coverage floor would fail for a
      # reason that has nothing to do with the database.
      - name: Run integration tests
        if: steps.guard.outputs.run == 'true'
        run: uv run pytest -m integration -v --no-cov

      - name: Report a skipped run
        if: steps.guard.outputs.run != 'true'
        run: |
          echo "Integration job skipped: the database layer is not present on this ref."
