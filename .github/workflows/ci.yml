# =============================================================================
# Automotive Retail Performance Intelligence (ARPI) — continuous integration
# =============================================================================
# NO SECRETS RULE
# ---------------
# This workflow must run to completion on a fork, with zero repository secrets
# configured. It never touches a hosted database, a cloud account, Power BI
# Service, or any external service. The only credential that appears anywhere in
# this file is the throwaway password of a PostgreSQL container that lives and
# dies inside a single job. If a future change here needs `secrets.*`, that is a
# signal the change belongs somewhere other than CI.
#
# JOBS
# ----
#   quality             formatting, lint, types, unit and data-quality tests
#   repository-checks   naming, documentation links, secret safety net,
#                       Power BI model structure, real-engine validation evidence
#   deployment-tooling  Railway deployment specification, IaC declaration and the
#                       tooling's own tests — all offline, no credential
#   integration         PostgreSQL DDL + integration tests against a container
#
# The Power BI checks in `repository-checks` read the PBIP project's TMDL and
# JSON as text and compare a hash. NONE OF THEM LAUNCHES OR CONTACTS A SEMANTIC
# MODEL ENGINE, and nothing in this workflow ever may. Power BI Desktop is a
# Windows application; Microsoft Fabric needs a tenant, a workspace and a cloud
# PostgreSQL database. A refresh needs a loaded `reporting` schema. Both engines'
# results are produced outside CI and recorded in
# `powerbi/validation/desktop_validation_results.json` and
# `powerbi/validation/fabric_validation_results.json`, and ADR-0008 governs what
# either of them has to prove.
#
# `quality` and `repository-checks` are the gate for every change.
# `integration` is deliberately a separate job so that a PostgreSQL service
# hiccup is visually distinguishable from a genuine code failure.
# =============================================================================

name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

# Superseded runs on the same ref are cancelled; the newest push is the one that
# matters and runner minutes are finite.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. No job here writes to the repository, publishes a
# package, or comments on a pull request.
permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  # ---------------------------------------------------------------------------
  # 1. quality — the authoritative gate for Python source and tests.
  #    Runs exactly the commands documented in CONTRIBUTING.md, in the same
  #    order, so a green local run predicts a green CI run.
  # ---------------------------------------------------------------------------
  quality:
    name: Quality (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Do not cancel 3.12 because 3.11 failed; seeing both results is the point
      # of the matrix.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # `pyproject.toml` remains the declaration of SUPPORTED RANGES. `uv.lock` is
      # the REVIEWED RESOLUTION of those ranges, and it is what CI, a developer and
      # the Railway provisioning image all install. The distinction matters: the
      # ranges say what the project claims to work with, the lock says what was
      # actually tested.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Fails when `uv.lock` no longer satisfies `pyproject.toml` -- for instance
      # when a dependency was added or a bound changed without relocking. It does
      # NOT regenerate the lock: a CI job that silently relocks defeats the point of
      # having one, because the resolution nobody reviewed is the one that ships.
      - name: Verify the lock is current
        run: uv lock --check

      # `--frozen` installs the lock exactly and refuses to resolve anything. A
      # network hiccup or a newly published version cannot change what this job runs.
      - name: Install from the frozen lock
        run: uv sync --frozen --all-extras

      - name: Report the resolved toolchain
        run: |
          uv --version
          uv run python --version
          uv run ruff --version
          uv run mypy --version
          uv run pytest --version
          uv run python -c "import pandas, pydantic; print('pandas', pandas.__version__, 'pydantic', pydantic.__version__)"

      # Formatting first: a formatting failure is the cheapest to fix and would
      # otherwise create noise in the lint output.
      - name: Check formatting (ruff format)
        run: uv run ruff format --check .

      # `--output-format=github` turns findings into inline annotations on the
      # pull-request diff.
      - name: Lint (ruff check)
        run: uv run ruff check --output-format=github .

      - name: Type-check (mypy)
        run: uv run mypy src tests

      # Integration tests are excluded here; they need PostgreSQL and run in the
      # dedicated job below.
      - name: Run unit and data-quality tests with coverage
        run: |
          uv run pytest -m "not integration" \
            --cov=arpi \
            --cov-report=term-missing \
            --cov-report=xml

      # The step above already runs the whole non-integration suite in ONE process,
      # which is what makes cross-test state leakage visible at all. It is not
      # sufficient on its own: it fixes ONE order, so a leak that only matters in a
      # different order stays hidden.
      #
      # `configure_logging` sets the level and `propagate = False` on the process-global
      # `arpi` logger. Before `tests/conftest.py` grew `_isolated_logging`, that state
      # survived the test that caused it, and a later `caplog` assertion saw an empty
      # `caplog.text`. The same test passed alone and failed after `test_cli.py`.
      #
      # These two runs pin that down: the first is the order that actually failed, the
      # second is its reverse. Both are deterministic and cost a few seconds, so neither
      # needs a random-order plugin -- which would trade reproducibility for coverage of
      # orders nobody has seen fail.
      - name: Run the logging-sensitive modules in the order that used to fail
        run: |
          uv run pytest -p no:randomly --no-cov -q \
            tests/unit/test_logging_config.py \
            tests/unit/test_cli.py \
            tests/unit/test_ingestion.py \
            tests/unit/test_logging_isolation.py

      - name: Run the same modules in the reverse order
        run: |
          uv run pytest -p no:randomly --no-cov -q \
            tests/unit/test_logging_isolation.py \
            tests/unit/test_ingestion.py \
            tests/unit/test_cli.py \
            tests/unit/test_logging_config.py

      - name: Upload the coverage report
        # Upload even when the tests failed; the partial report is often the
        # fastest way to see what regressed.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 1b. floor — the project at the MINIMUM dependency versions it claims to support.
  #
  #     `pyproject.toml` declares ranges such as `pandas>=2.2`. The lock pins the
  #     top of those ranges, so without this job the lower bound is an untested
  #     assertion: CI would prove the project works with one resolution and claim
  #     it works with an interval.
  #
  #     That gap was not hypothetical. `DQ-EMP-003` evaluated
  #     `Timestamp("9999-12-31") + Timedelta(days=1)`, which raises
  #     `OutOfBoundsDatetime` on pandas 2.2 and silently widens on pandas 3.0. CI
  #     was green on 3.0 while a supported floor crashed a gating validator. This
  #     job is what makes `>=2.2` mean something.
  #
  #     One job, one interpreter, no coverage, non-integration only -- a couple of
  #     minutes, rather than doubling the matrix.
  # ---------------------------------------------------------------------------
  floor:
    name: Minimum supported dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The declared floor of `requires-python`. Resolving lowest-direct on a newer
      # interpreter would silently raise the floor, because old releases have no
      # wheels for it.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      # `lowest-direct` pins the DIRECT dependencies to their declared minimums and
      # lets transitives resolve normally. Full `lowest` would also drag every
      # transitive to its floor, which tests the ecosystem's history rather than
      # this project's declaration.
      #
      # Deliberately NOT `--frozen`: the whole point is to resolve something other
      # than the lock.
      - name: Install the declared minimum versions
        run: uv sync --resolution lowest-direct --all-extras

      # pandas 2.2 emits a DeprecationWarning at import asking for pyarrow, and
      # `filterwarnings = ["error"]` turns it into a collection error. Installing
      # what pandas asks for keeps this job's warning strictness identical to the
      # main gate -- the alternative, relaxing `filterwarnings` here, would mean the
      # floor job tested less than the job it is meant to backstop. pyarrow is not
      # an ARPI dependency and is not in the lock.
      - name: Satisfy pandas 2.2's pyarrow deprecation notice
        run: uv pip install pyarrow

      - name: Report the resolved floor
        run: |
          uv run python --version
          uv run python -c "import pandas, pydantic; print('pandas', pandas.__version__, 'pydantic', pydantic.__version__)"

      # Lint and types are deliberately absent: ruff 0.6 and mypy 1.10 disagree
      # with current versions about formatting and inference, and pinning the source
      # to satisfy both would mean writing to the older tool. Behaviour is what the
      # floor has to preserve, so behaviour is what is asserted.
      - name: Run unit and data-quality tests at the floor
        run: uv run pytest -m "not integration" -q --no-cov

  # ---------------------------------------------------------------------------
  # 1c. database-setup-image — the Railway provisioning image actually builds.
  #
  #     `frontend.yml` builds `portfolio/Dockerfile.railway`, the WEBSITE image.
  #     Nothing built `deployment/railway/Dockerfile.database-setup`, so a change to
  #     the image that loads the database was only discovered by deploying it.
  #
  #     That matters more now that the image installs `uv sync --frozen`: the whole
  #     point of the lock is that Railway and CI install the same graph, and an
  #     assertion nobody executes is not evidence.
  #
  #     Build only. Running it needs a PostgreSQL superuser and Railway reference
  #     variables, and the NO SECRETS RULE at the top of this file keeps that out of
  #     CI. The integration job already proves the SQL sequence against a container.
  # ---------------------------------------------------------------------------
  database-setup-image:
    name: Railway database-setup image
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Repository root as the context, matching the Dockerfile's own header and
      # what Railway does.
      - name: Build the provisioning image
        run: |
          docker build \
            --file deployment/railway/Dockerfile.database-setup \
            --tag arpi-database-setup:ci \
            .

      # A build that succeeds and produces an image the entry point cannot run is
      # not a passing build. These are the four things `provision_database.sh`
      # depends on.
      - name: Assert the image contract
        run: |
          docker run --rm --entrypoint sh arpi-database-setup:ci -c '
            set -eux
            arpi --version
            python -c "import pandas, psycopg, pydantic, yaml"
            psql --version
            test -f uv.lock
            test -x ./provision_database.sh
          '

      # The reason the image was changed at all: it must install what the lock says,
      # not whatever the index served at build time.
      - name: Assert the image installed the locked versions
        run: |
          locked=$(python - <<'PY'
          import re, pathlib
          text = pathlib.Path("uv.lock").read_text()
          found = dict(re.findall(r'\[\[package\]\]\nname = "([^"]+)"\nversion = "([^"]+)"', text))
          print(found["pandas"], found["psycopg"], found["pydantic"])
          PY
          )
          built=$(docker run --rm --entrypoint python arpi-database-setup:ci -c \
            'import pandas, psycopg, pydantic; print(pandas.__version__, psycopg.__version__, pydantic.__version__)')
          echo "lock:  $locked"
          echo "image: $built"
          test "$locked" = "$built"

  # ---------------------------------------------------------------------------
  # 2. repository-checks — repository hygiene, not code correctness.
  #    Every script here is standard library only and is run WITHOUT installing
  #    the package, which keeps this job to a few seconds.
  # ---------------------------------------------------------------------------
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # check_secrets.py inspects the git index, so a shallow checkout with
          # full file listing is enough; history is not needed.
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Fails if the retired project name is used as a current identity.
      # ADR-0001 is the decision this enforces.
      - name: Naming consistency
        run: python scripts/check_naming.py

      # Fails on a broken relative Markdown link or an unresolvable heading
      # anchor. External links are not fetched; CI has no reason to be online.
      - name: Documentation links
        run: python scripts/check_docs_links.py

      # A safety net, not a real secret scanner. See the module docstring and
      # SECURITY.md for what it does and does not cover.
      - name: Secret safety net
        run: python scripts/check_secrets.py

      # Fails when the semantic model departs from the register in
      # powerbi/model_documentation/ -- a table, relationship, hidden column or
      # measure that the specification does not describe, a bidirectional
      # filter, a schema other than `reporting`, or a PII-bearing column. It
      # parses TMDL as text; POWER BI DESKTOP IS NEVER LAUNCHED.
      - name: Power BI model structure
        run: python scripts/check_powerbi_model.py

      # ADR-0008 accepts TWO real-engine validation paths -- Power BI Desktop
      # and Microsoft Fabric -- with an identical proof obligation. Each engine
      # reports one of five states: PASSED, PENDING, STALE, FAILED, MISSING.
      # STALE and FAILED block on every branch, because a stale pass is more
      # dangerous than no pass: it reads as validated while describing a model
      # that no longer exists. PENDING exits zero so a branch can be worked on
      # before an engine has run -- it is never rendered as a pass.
      #
      # NOTHING HERE LAUNCHES OR CONTACTS AN ENGINE. Power BI Desktop is a
      # Windows application and Microsoft Fabric needs a tenant, a workspace and
      # a cloud database; a GitHub runner has none of those. These steps read
      # evidence files and compare a hash, and that is all they can ever do.
      - name: Real-engine validation evidence (Power BI Desktop)
        run: python scripts/check_desktop_validation_freshness.py

      - name: Real-engine validation evidence (Microsoft Fabric)
        run: python scripts/check_fabric_validation_freshness.py

      # The gate itself. Either engine passing satisfies it; static validation
      # alone never does.
      #
      # `--require-pass` is DELIBERATELY NOT SET YET. Turning it on before any
      # passing real-engine evidence exists would break the branch for a
      # condition nobody can currently clear, which teaches people to bypass the
      # check rather than to satisfy it. The flag goes on in the same change
      # that lands the first passing evidence -- see `P2.1-14` in
      # docs/requirements/PHASE_2_BACKLOG.md. Until then this step reports
      # PENDING honestly and exits zero.
      - name: Real-engine validation gate (ADR-0008)
        run: python scripts/check_real_engine_validation.py


  # ---------------------------------------------------------------------------
  # 4. deployment-tooling — the Railway deployment, checked without Railway.
  #
  #    NO CREDENTIAL, NO NETWORK, AND THEREFORE NO EXCEPTION TO THE NO-SECRETS
  #    RULE. Everything here is a statement about source-controlled files:
  #
  #      * the deployment specification is internally consistent, agrees with
  #        railway.json, targets a non-production environment, and contains no
  #        credential
  #      * `.railway/railway.ts` compiles, through the Railway SDK's own runner,
  #        into the resource graph the specification describes — with references
  #        where references are required, server-side generators where passwords
  #        are required, and no literal credential anywhere
  #      * the tooling's own tests pass, including the bootstrap tool's behaviour
  #        against a fake Railway CLI: that a dry run issues no mutating command,
  #        that a converged project is not re-created, and that the token never
  #        reaches a command line
  #
  #    The one thing needing a credential — reading the LIVE project — lives in
  #    `railway-bootstrap.yml`, which is `workflow_dispatch` only.
  # ---------------------------------------------------------------------------
  deployment-tooling:
    name: Deployment tooling
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install the deployment tooling
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # No runtime dependencies exist in this package — every one is development
      # tooling that never ships — so both audits are run and both must be clean.
      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Validate the deployment specification
        run: npm run spec:validate

      - name: Evaluate the Railway declaration
        run: npm run iac:evaluate

      - name: Deployment tooling tests
        run: npm test

  # ---------------------------------------------------------------------------
  # 3. integration — SQL objects and database-backed tests.
  #    Kept separate on purpose: if this job is red and `quality` is green, the
  #    problem is the database layer or the service container, not the Python
  #    package.
  #
  #    The job SKIPS GRACEFULLY (green, with a notice) when `sql/` or
  #    `tests/integration/` is absent, so early-phase branches are not blocked
  #    by infrastructure that does not exist yet.
  # ---------------------------------------------------------------------------
  integration:
    name: Integration (PostgreSQL 16)
    runs-on: ubuntu-latest
    continue-on-error: false

    services:
      postgres:
        image: postgres:16
        env:
          # THROWAWAY CI-ONLY CONTAINER CREDENTIAL — NOT A SECRET.
          # This password exists for the lifetime of one job, on a container
          # reachable only from that job's network namespace. It is written as a
          # literal on purpose: putting it in `secrets.*` would imply it protects
          # something, and would stop this workflow from running on forks.
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: arpi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arpi -h localhost -p 5432"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # ARPI configuration overrides (see the configuration contract: `ARPI_`
      # prefix, `__` nested delimiter, password never in YAML).
      ARPI_PROFILE: test
      ARPI_DATABASE__ENABLED: "true"
      ARPI_DATABASE__HOST: localhost
      ARPI_DATABASE__PORT: "5432"
      ARPI_DATABASE__NAME: arpi
      ARPI_DATABASE__USER: postgres
      ARPI_DATABASE__PASSWORD: postgres
      ARPI_DATABASE__SSLMODE: disable
      # libpq equivalents so `psql` and any direct psycopg connection agree.
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: arpi
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Guard: decide once whether there is anything to do, and reuse the answer.
      - name: Decide whether the database layer exists yet
        id: guard
        run: |
          sql_count=$(find sql -name '*.sql' -type f 2>/dev/null | wc -l)
          if [ ! -d sql ] || [ "$sql_count" -eq 0 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Integration skipped::No SQL scripts found under sql/."
            exit 0
          fi
          if [ ! -d tests/integration ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Integration skipped::tests/integration/ does not exist."
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "Found $sql_count SQL script(s)."

      - name: Set up Python 3.11
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        if: steps.guard.outputs.run == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Same frozen lock as the quality job, so an integration failure can never be
      # explained by the two jobs having resolved different dependency graphs.
      - name: Install from the frozen lock
        if: steps.guard.outputs.run == 'true'
        run: uv sync --frozen --all-extras

      - name: Ensure the psql client is available
        if: steps.guard.outputs.run == 'true'
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql --version

      - name: Wait for the PostgreSQL service container
        if: steps.guard.outputs.run == 'true'
        run: |
          for attempt in $(seq 1 30); do
            if pg_isready -q; then
              echo "PostgreSQL is accepting connections (attempt $attempt)."
              exit 0
            fi
            sleep 2
          done
          echo "::error title=PostgreSQL unavailable::The service container never became ready."
          exit 1

      # The SQL tree is numbered so that lexical order is execution order:
      # 00_database -> 01_raw -> 02_staging -> 03_dimensions -> ... -> 08_validation.
      #
      # This is the 25-step sequence defined in sql/README.md section 2, and it is
      # the same sequence tests/integration/conftest.py builds:
      #   * the glob is `sql/0*/*.sql`, which cannot match `sql/99_local_reset.sql`
      #     — that script DROPs every ARPI schema and must never run here;
      #   * `07_security/02_role_verification.sql` is a read-only operator report,
      #     not a build step, so it is skipped;
      #   * `07_security/01_grants.sql` runs a second time as step 25, because the
      #     objects created by 08_validation would otherwise stay owned by the
      #     bootstrap role instead of arpi_admin.
      - name: Run the ordered SQL initialisation sequence
        if: steps.guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          find sql/0* -name '*.sql' -type f \
            ! -path 'sql/07_security/02_role_verification.sql' \
            | LC_ALL=C sort > /tmp/arpi_sql_sequence.txt
          echo 'sql/07_security/01_grants.sql' >> /tmp/arpi_sql_sequence.txt
          while read -r script; do
            echo "::group::$script"
            psql -v ON_ERROR_STOP=1 --quiet --no-psqlrc -f "$script"
            echo "::endgroup::"
          done < /tmp/arpi_sql_sequence.txt

      # `--no-cov` disables the coverage plugin that pyproject.toml enables by
      # default. The integration subset exercises SQL, not the whole package, so
      # measuring it against the project-wide coverage floor would fail for a
      # reason that has nothing to do with the database.
      - name: Run integration tests
        if: steps.guard.outputs.run == 'true'
        run: uv run pytest -m integration -v --no-cov

      - name: Report a skipped run
        if: steps.guard.outputs.run != 'true'
        run: |
          echo "Integration job skipped: the database layer is not present on this ref."
