[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arpi"
version = "0.1.0"
description = "Automotive Retail Performance Intelligence: a synthetic automotive retail analytics warehouse, data-generation platform, and data-quality framework."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael Palmer" }]
maintainers = [{ name = "Michael Palmer" }]
keywords = [
    "analytics",
    "automotive-retail",
    "business-intelligence",
    "data-engineering",
    "data-quality",
    "dimensional-modeling",
    "postgresql",
    "synthetic-data",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: SQL",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "pandas>=2.2",
]

[project.optional-dependencies]
db = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "pandas-stubs",
]

[project.urls]
Homepage = "https://github.com/mpalmer79/Automotive-Retail-Performance-Intelligence"
Repository = "https://github.com/mpalmer79/Automotive-Retail-Performance-Intelligence"
Issues = "https://github.com/mpalmer79/Automotive-Retail-Performance-Intelligence/issues"

[project.scripts]
arpi = "arpi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arpi = ["py.typed"]

# --------------------------------------------------------------------------------------
# Lint and format (ruff is the only linter and the only formatter for this project)
# --------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".venv", "data", "powerbi", "excel"]

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "ARG",  # flake8-unused-arguments
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "D",    # pydocstyle
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "PL",   # pylint
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "RUF",  # ruff-specific
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "A003",   # class attributes may shadow builtins (e.g. LoggingConfig.format)
    "D105",   # magic methods do not require docstrings
    "D203",   # incompatible with D211 (no blank line before class docstring)
    "D213",   # incompatible with D212 (summary on the first physical line)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.isort]
known-first-party = ["arpi"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ARG001",  # pytest fixtures are frequently requested for their side effects
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "PLR0913",
    "PLR2004", # magic numbers are the point of an assertion
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

# --------------------------------------------------------------------------------------
# Types
# --------------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
strict = true
warn_unused_ignores = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

# --------------------------------------------------------------------------------------
# Tests
# --------------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config --cov=arpi --cov-report=term-missing"
markers = [
    "integration: requires a running PostgreSQL instance",
    "data_quality: runs the synthetic generators and asserts data-quality rules (no database)",
    "slow: takes a noticeable amount of wall-clock time",
]
filterwarnings = ["error"]

# --------------------------------------------------------------------------------------
# Coverage
# --------------------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["src/arpi"]
relative_files = true

[tool.coverage.paths]
source = ["src/arpi", "*/src/arpi", "*/site-packages/arpi"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "if __name__ == .__main__.:",
]
