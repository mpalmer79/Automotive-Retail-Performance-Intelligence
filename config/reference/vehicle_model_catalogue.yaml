# =====================================================================================
# ARPI reference data: vehicle model catalogue
# =====================================================================================
# Purpose
#   Source-controlled reference data for `warehouse.dim_vehicle_model`. Every physical
#   vehicle, inventory snapshot, and sale in ARPI resolves to one row expanded from this
#   file, so it is the governed vocabulary for make, model, trim, body style, vehicle
#   class, fuel type, drivetrain, and transmission.
#
# WHAT THIS FILE IS -- AND IS NOT
#   * It is a **representative synthetic subset**, hand-authored for this project.
#   * It is **not** sourced from any manufacturer feed, dealer management system,
#     NHTSA vPIC extract, or any other external data source. **No network call is made
#     at any point.** `features.enable_public_vehicle_enrichment` stays `false` and is
#     not read by the generator.
#   * It is **not complete** and **not current**. It does not enumerate every model line,
#     trim, model year, or specification a manufacturer has offered or offers today, and
#     the specifications recorded here are plausible rather than verified. Nothing in
#     ARPI may be presented as an authoritative product catalogue.
#   * Make, model, and trim strings are factual product names. They are commercial
#     product identifiers, not personal data, and they carry no relationship to any real
#     vehicle, VIN, owner, or transaction.
#
# STRUCTURE
#   `model_lines` holds one entry per model line. Each entry declares the attributes the
#   whole line shares, a default `model_years` list, and a `trims` list. The generator
#   expands the cross product of (trim, model year) into one catalogue row per
#   `(model_year, make, model, trim)` -- the declared grain of `dim_vehicle_model`.
#
#   Model-line keys
#     make                    required, text
#     model                   required, text
#     franchise_alignment     required, one of: Chevrolet | Subaru | Independent Used
#     body_style              required, one of: Sedan | Coupe | Hatchback | Wagon | SUV |
#                             Crossover | Pickup | Van | Convertible
#     vehicle_class           required, one of: Compact | Midsize | Fullsize | Luxury |
#                             Sports | Truck | SUV | Van
#     doors                   required, integer 2..5
#     seating_capacity        required, integer 2..8
#     is_current_model_line   required, boolean
#     model_years             required, non-empty list of integers 1990..2030
#     trims                   required, non-empty list
#
#   Trim keys
#     trim                    required, text
#     fuel_type               required, one of: Gasoline | Diesel | Hybrid |
#                             Plug-in Hybrid | Electric
#     drivetrain              required, one of: FWD | RWD | AWD | 4WD
#     transmission            required, one of: Automatic | Manual | CVT
#     model_years             optional, overrides the model-line list
#     doors                   optional, overrides the model-line value
#     seating_capacity        optional, overrides the model-line value
#
# AUTHORING RULES (enforced by the loader; a violation fails the run)
#   * Every enumerated value must be spelled exactly as listed above.
#   * `(model_year, make, model, trim)` must be unique across the whole expansion.
#   * A model line with `is_current_model_line: false` must not carry a model year later
#     than 2025 -- a discontinued line cannot have a current model year.
#
# DISTRIBUTION INTENT (asserted as bands by the test suite, never as exact figures)
#   * All-wheel drive is **elevated but not universal**, reflecting the New England
#     market: Subaru is heavily AWD but not entirely (the BRZ is rear-wheel drive),
#     Chevrolet is mixed across FWD/RWD/AWD/4WD, and the used long tail is mixed.
#   * Model years span 2015..2026 with a deliberate recent-year skew, so used inventory
#     of every plausible age exists alongside current-model-year new inventory.
#   * Trim counts differ by model line, so the trim distribution is non-uniform.
#
# See DATA_DICTIONARY.md and docs/source-to-target/STM-004-dim-vehicle-model.md.
# =====================================================================================

