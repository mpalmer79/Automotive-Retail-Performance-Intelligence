<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    ARPI monogram, standalone. currentColor is resolved to the cyan signal token
    so the file is usable outside a styled context.
    Master geometry: 32x32 viewBox, 8-unit lattice, apex at (16,5).
  -->
  <title>ARPI monogram</title>
  <g fill="#5fdcee" opacity="0.28">
    <circle cx="6" cy="6" r="1.15"/><circle cx="16" cy="6" r="1.15"/><circle cx="26" cy="6" r="1.15"/>
    <circle cx="6" cy="16" r="1.15"/><circle cx="26" cy="16" r="1.15"/>
    <circle cx="6" cy="26" r="1.15"/><circle cx="16" cy="26" r="1.15"/><circle cx="26" cy="26" r="1.15"/>
  </g>
  <g fill="none" stroke="#5fdcee" stroke-width="2.6" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M6 27 L16 5 L26 27"/>
    <path d="M10.4 18.4 H21.6"/>
  </g>
  <circle cx="16" cy="5" r="2.4" fill="#5fdcee"/>
</svg>
