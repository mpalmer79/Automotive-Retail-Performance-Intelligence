<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!--
    ARPI social preview - editable source.

    Rendered to public/social-preview.png by `npm run assets`
    (scripts/render-raster-assets.ts), which screenshots this file through the
    Chromium already present for Playwright. The SVG is the master; the PNG is a
    build artefact that exists because Open Graph consumers do not reliably
    render SVG.

    WHY THIS CARD WAS REPLACED  (P2-6, closed by the DASH.13 closeout)
    -----------------------------------------------------------------
    The previous card was accurate and had stopped being representative. It led
    with a wireframe of `/inventory` - a listing table with neutral bars in place
    of values - which was the honest way to show the product in the increment
    that drew it, and became the wrong subject once the operating console shipped.
    A recruiter opening a LinkedIn card saw a reference page, and the Executive
    Command Center is the front door.

    `DASH.13` recorded that as P2-6 and deliberately declined to redesign a social
    card during a release freeze. The freeze is over; this is the redesign.

    WHAT THE FIGURES ON THIS CARD ARE
    ---------------------------------
    REAL VALUES FROM THE COMMITTED SYNTHETIC DATASET, not invented ones, and not
    neutral bars either. Every number below was produced by the product's OWN
    selectors - `buildExecutiveOverview()` over `src/generated/dashboard`, the same
    governed path that renders `/` - rather than typed by hand into a drawing.
    That is what makes them checkable, which is the only reason they are allowed
    to be here.

      as of            December 2025, all three stores, no filters
                       (the default Executive Command Center view)
      retail units     92                            KPI-SLS-001
      total gross      $321,935                      KPI-GRS-001
      gross per unit   $3,499                        KPI-GRS-006
      aged inventory   40.4%                         KPI-INV-006, at the 2025-12-31 position
      inventory        $5,438,057                    KPI-INV-002, at the 2025-12-31 position

      total gross, trailing six months (KPI-GRS-001):
        2025-07  358,088.22      2025-10  256,409.08
        2025-08  353,811.91      2025-11  289,389.62
        2025-09  356,938.26      2025-12  321,934.50

    The sparkline is plotted from those six figures and from nothing else. It is
    not a decorative up-and-to-the-right: the shape it draws is a drop through
    October and a partial recovery, because that is what the dataset contains.
    Drawing a flattering curve instead would have been the one thing this project
    is about not doing.

    THE DISCLOSURE IS NOT SMALL PRINT. Granite Auto Group is fictional and every
    figure above is synthetic. That statement gets a bordered panel and an accent
    colour, in the same visual weight as the product, because a card carrying real
    -looking dealership numbers without it would be misread in exactly one
    direction.

    EMPLOYEE AND STORE FAIRNESS. No store is named, ranked, ordered or compared on
    this card, and no employee appears on it at all. The product's store
    comparison is a legitimate management view IN CONTEXT; a three-bar chart on a
    social card, stripped of its disclosures, reads as a league table. That is the
    freeze `docs/product/PRODUCT_VISION.md` describes, applied to the one surface
    where the context cannot travel with the picture.
  -->
  <title>ARPI - Automotive Retail Performance Intelligence: dealership management intelligence built by Michael Palmer, on synthetic data for a fictional dealer group</title>

  <defs>
    <!-- The dimensional-grid motif, as a tile. Same 28px spacing as the
         `grid-motif` utility in globals.css. -->
    <pattern id="lattice" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#47556b" />
    </pattern>

    <!-- A radial mask so the lattice fades out toward the lower right rather
         than tiling to a hard edge. -->
    <radialGradient id="latticeFade" cx="0.14" cy="0.08" r="1.05">
      <stop offset="0" stop-color="#fff" stop-opacity="0.85" />
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.26" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
    <mask id="latticeMask">
      <rect width="1200" height="630" fill="url(#latticeFade)" />
    </mask>

    <!-- The interface panel's own ground, one step above the page ground so the
         frame reads as a surface sitting on it. -->
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1219" />
      <stop offset="1" stop-color="#080c12" />
    </linearGradient>

    <!-- The area under the gross trend. Fades out downward so the line, not the
         fill, is what the eye reads. -->
    <linearGradient id="trendFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22c8e0" stop-opacity="0.26" />
      <stop offset="1" stop-color="#22c8e0" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="lane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06a8c4" stop-opacity="0.15" />
      <stop offset="1" stop-color="#5fdcee" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Ground -->
  <rect width="1200" height="630" fill="#05070b" />
  <rect width="1200" height="630" fill="url(#lattice)" mask="url(#latticeMask)" opacity="0.5" />

  <!-- Alignment marks. A blueprint annotation, not decoration for its own sake:
       they mark the content's left edge and cap height. -->
  <g stroke="#2f3a4d" stroke-width="1">
    <path d="M72 56 V74 M72 56 H90" />
    <path d="M1128 574 V556 M1128 574 H1110" />
  </g>

  <!-- ================================================================== -->
  <!-- Left column: identity, positioning, domains, disclosure            -->
  <!-- ================================================================== -->

  <!-- Identity mark -->
  <g transform="translate(72 74)">
    <g transform="scale(1.5)">
      <g fill="#5fdcee" opacity="0.42">
        <circle cx="6" cy="6" r="1.15"/><circle cx="16" cy="6" r="1.15"/><circle cx="26" cy="6" r="1.15"/>
        <circle cx="6" cy="16" r="1.15"/><circle cx="26" cy="16" r="1.15"/>
        <circle cx="6" cy="26" r="1.15"/><circle cx="16" cy="26" r="1.15"/><circle cx="26" cy="26" r="1.15"/>
      </g>
      <g fill="none" stroke="#5fdcee" stroke-width="2.6" stroke-linecap="square" stroke-linejoin="miter">
        <path d="M6 27 L16 5 L26 27"/><path d="M10.4 18.4 H21.6"/>
      </g>
      <circle cx="16" cy="5" r="2.4" fill="#5fdcee"/>
    </g>
  </g>

  <!-- ARPI, large. The first thing read at any card size. -->
  <text x="140" y="118" fill="#f2f6fc" font-family="'Space Grotesk',ui-sans-serif,system-ui,sans-serif" font-size="54" font-weight="700" letter-spacing="-1.4">ARPI</text>

  <!-- The expansion, immediately under it and deliberately quieter. -->
  <text x="72" y="160" fill="#8b99b3" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="21" letter-spacing="0.1">Automotive Retail Performance Intelligence</text>

  <path d="M72 188 H604" stroke="#1e2633" stroke-width="1"/>

  <!-- THE POSITIONING LINE. What the product IS, in the words the repository
       already uses for it. Two lines at 34px rather than one at 26px: at
       400x210 - a LinkedIn card on a phone - 26px is where a line stops being
       read and starts being texture. -->
  <g fill="#f2f6fc" font-family="'Space Grotesk',ui-sans-serif,system-ui,sans-serif" font-size="34" font-weight="600" letter-spacing="-0.7">
    <text x="72" y="244">Dealership management</text>
    <text x="72" y="288">intelligence</text>
  </g>

  <!-- The operating domains. One line, product first. -->
  <text x="72" y="326" fill="#9fb0c9" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="13" letter-spacing="0.9">Sales · Inventory · F&amp;I · Leads · Accounting</text>

  <!-- The platform underneath the product: four governed PostgreSQL layers
       resolving into one model. Compact and horizontal, because the card's
       subject is the product and this is the answer to "what is under it?" -->
  <!-- All FOUR layers, named as the warehouse names them. An earlier draft drew
       three and dropped `staging`, which made the picture tidier and the claim
       wrong: the repository's layers are raw, staging, warehouse and reporting,
       and a diagram of a data platform that quietly omits one of its layers is
       the kind of small inaccuracy this project exists to not ship. -->
  <g transform="translate(72 372)">
    <path d="M8 12 H326" stroke="url(#lane)" stroke-width="2"/>
    <g fill="#080b11" stroke="#22c8e0" stroke-width="1.7">
      <rect x="0" y="5" width="14" height="14" rx="3.5"/>
      <rect x="88" y="5" width="14" height="14" rx="3.5"/>
      <rect x="176" y="5" width="14" height="14" rx="3.5"/>
      <rect x="264" y="5" width="14" height="14" rx="3.5"/>
    </g>
    <circle cx="326" cy="12" r="9.5" fill="#06323d" stroke="#5fdcee" stroke-width="2"/>
    <circle cx="326" cy="12" r="3.4" fill="#5fdcee"/>
    <g fill="#64748f" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="9.5" letter-spacing="0.7">
      <text x="0" y="38">RAW</text>
      <text x="88" y="38">STAGING</text>
      <text x="176" y="38">WAREHOUSE</text>
      <text x="264" y="38">REPORTING</text>
      <text x="352" y="16">GOVERNED KPI MODEL</text>
    </g>
  </g>

  <!-- The stack, secondary to the product as section 24 requires. -->
  <text x="72" y="446" fill="#64748f" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11.5" letter-spacing="0.8">POSTGRESQL · PYTHON · NEXT.JS · TYPESCRIPT · POWER BI</text>

  <!-- The synthetic-data statement. A bordered panel and a warm accent rather
       than a corner note: this card carries real-looking dealership figures, and
       without this it is misread in exactly one direction. -->
  <g>
    <rect x="72" y="474" width="532" height="62" rx="10" fill="#3d2a05" fill-opacity="0.4" stroke="#eaab2c" stroke-opacity="0.45"/>
    <text x="94" y="500" fill="#f7c96a" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="600">Synthetic data · Granite Auto Group is fictional</text>
    <text x="94" y="521" fill="#fcdfa4" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">No real dealership, customer or employee data exists in it.</text>
  </g>

  <!-- ================================================================== -->
  <!-- Right column: the Executive Command Center                         -->
  <!-- ================================================================== -->

  <g>
    <rect x="648" y="74" width="480" height="462" rx="14" fill="url(#panel)" stroke="#232c3c" stroke-width="1.5"/>

    <!-- Chrome: the surface's own name and route. -->
    <path d="M648 110 H1128" stroke="#1a212e" stroke-width="1"/>
    <g>
      <circle cx="670" cy="93" r="3.5" fill="#5fdcee" opacity="0.75"/>
      <circle cx="683" cy="93" r="3.5" fill="#ad9cf6" opacity="0.6"/>
      <circle cx="696" cy="93" r="3.5" fill="#3b4658"/>
    </g>
    <text x="714" y="98" fill="#d5deec" font-family="'Space Grotesk',ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600">Executive Command Center</text>
    <text x="1106" y="98" text-anchor="end" fill="#64748f" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11.5">/</text>

    <!-- The scope every figure below is read under. On the card for the same
         reason it is on the page: a number without its period and its store
         scope is not a number anybody can check. -->
    <text x="670" y="132" fill="#64748f" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="10" letter-spacing="0.7">ALL STORES · DECEMBER 2025 · VS NOVEMBER</text>

    <!-- ---------------------------------------------------------------- -->
    <!-- The KPI rail. Four of the eight cards the page renders.           -->
    <!-- ---------------------------------------------------------------- -->
    <g>
      <rect x="670" y="148" width="210" height="74" rx="8" fill="#0b1018" stroke="#1b2432"/>
      <text x="686" y="172" fill="#64748f" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="9.5" letter-spacing="0.8">RETAIL UNITS</text>
      <text x="686" y="205" fill="#f2f6fc" font-family="'Space Grotesk',ui-sans-serif,system-ui,sans-serif" font-size="29" font-weight="600">92</text>

      <rect x="896" y="148" width="210" height="74" rx="8" fill="#0b1018" stroke="#1b2432"/>
      <text x="912" y="172" fill="#64748f" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="9.5" letter-spacing="0.8">TOTAL GROSS</text>
      <text x="912" y="205" fill="#f2f6fc" font-family="'Space Grotesk',ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="600">$321,935</text>

      <rect x="670" y="234" width="210" height="74" rx="8" fill="#0b1018" stroke="#1b2432"/>
      <text x="686" y="258" fill="#64748f" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="9.5" letter-spacing="0.8">GROSS PER RETAIL UNIT</text>
      <text x="686" y="291" fill="#f2f6fc" font-family="'Space Grotesk',ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="600">$3,499</text>

      <rect x="896" y="234" width="210" height="74" rx="8" fill="#0b1018" stroke="#1b2432"/>
      <text x="912" y="258" fill="#64748f" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="9.5" letter-spacing="0.8">AGED INVENTORY</text>
      <text x="912" y="291" fill="#f2f6fc" font-family="'Space Grotesk',ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="600">40.4%</text>
    </g>

    <!-- ---------------------------------------------------------------- -->
    <!-- Total gross, trailing six months. Plotted from the six committed   -->
    <!-- figures in the header comment and from nothing else.               -->
    <!--                                                                    -->
    <!-- min 256,409.08 (Oct) maps to y=424; max 358,088.22 (Jul) to y=364.  -->
    <!-- ---------------------------------------------------------------- -->
    <g>
      <text x="670" y="336" fill="#64748f" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="9.5" letter-spacing="0.8">TOTAL GROSS · TRAILING SIX MONTHS</text>

      <path d="M670 424 H1106" stroke="#161d28" stroke-width="1"/>

      <path d="M670 364 L757 367 L844 366 L932 424 L1019 406 L1106 387 L1106 424 L670 424 Z"
            fill="url(#trendFill)" stroke="none"/>
      <path d="M670 364 L757 367 L844 366 L932 424 L1019 406 L1106 387"
            fill="none" stroke="#5fdcee" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>

      <g fill="#0d1219" stroke="#5fdcee" stroke-width="1.8">
        <circle cx="670" cy="364" r="3"/>
        <circle cx="757" cy="367" r="3"/>
        <circle cx="844" cy="366" r="3"/>
        <circle cx="932" cy="424" r="3"/>
        <circle cx="1019" cy="406" r="3"/>
      </g>
      <!-- December is the selected period, so it is the emphasised point. -->
      <circle cx="1106" cy="387" r="4.6" fill="#5fdcee"/>

      <g fill="#5a6883" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="9" letter-spacing="0.6" text-anchor="middle">
        <text x="670" y="442">JUL</text>
        <text x="757" y="442">AUG</text>
        <text x="844" y="442">SEP</text>
        <text x="932" y="442">OCT</text>
        <text x="1019" y="442">NOV</text>
        <text x="1106" y="442">DEC</text>
      </g>
    </g>

    <!-- ---------------------------------------------------------------- -->
    <!-- Capital exposure. The second operating question the console leads   -->
    <!-- with, and the one that is about money already spent.                -->
    <!-- ---------------------------------------------------------------- -->
    <path d="M648 460 H1128" stroke="#1a212e" stroke-width="1"/>
    <g>
      <text x="670" y="482" fill="#64748f" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="9.5" letter-spacing="0.8">INVENTORY INVESTMENT</text>
      <text x="670" y="508" fill="#e6edf7" font-family="'Space Grotesk',ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="600">$5,438,057</text>

      <!-- 40.4% of a 206px track is 83.2px. The bar is the aged share of the
           same lot the figure to its left values. -->
      <rect x="900" y="486" width="206" height="9" rx="4.5" fill="#1b2432"/>
      <rect x="900" y="486" width="83" height="9" rx="4.5" fill="#eaab2c" fill-opacity="0.85"/>
      <!-- Right-aligned to the panel's inner edge. Set from x=900 it ran to
           roughly x=1139 and crossed the panel border at 1128. -->
      <text x="1106" y="512" text-anchor="end" fill="#8b99b3" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="9.5" letter-spacing="0.6">40.4% AGED · AT THE 2025-12-31 POSITION</text>
    </g>
  </g>

  <!-- Author, on the baseline rule -->
  <path d="M72 566 H1128" stroke="#1a212e" stroke-width="1"/>
  <text x="72" y="594" fill="#d5deec" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="600">Built by Michael Palmer</text>
  <text x="1128" y="594" text-anchor="end" fill="#64748f" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12" letter-spacing="0.8">GOVERNED ANALYTICS · MIT</text>
</svg>
