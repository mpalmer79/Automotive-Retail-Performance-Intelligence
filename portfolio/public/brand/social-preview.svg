<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!--
    ARPI social preview - editable source.

    Rendered to public/social-preview.png by `npm run assets`
    (scripts/render-raster-assets.ts), which screenshots this file through the
    Chromium already present for Playwright. The SVG is the master; the PNG is a
    build artefact that exists because Open Graph consumers do not reliably
    render SVG.

    Content requirements this file satisfies, from the brief:
      - the ARPI identity
      - PostgreSQL and Power BI positioning
      - the synthetic-data statement, prominent rather than in small print
      - Michael Palmer
      - the site's own visual system, not a stock template
  -->
  <title>Automotive Retail Performance Intelligence - a synthetic, reproducible dealership analytics platform by Michael Palmer</title>

  <defs>
    <!-- The dimensional-grid motif, as a tile. Same 28px spacing as the
         `grid-motif` utility in globals.css. -->
    <pattern id="lattice" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#47556b" />
    </pattern>

    <!-- A radial mask so the lattice fades out toward the lower right rather
         than tiling to a hard edge. -->
    <radialGradient id="latticeFade" cx="0.16" cy="0.1" r="1.05">
      <stop offset="0" stop-color="#fff" stop-opacity="0.85" />
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.28" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
    <mask id="latticeMask">
      <rect width="1200" height="630" fill="url(#latticeFade)" />
    </mask>

    <!-- The data-lane ribbon: source data resolving into a governed value. -->
    <linearGradient id="lane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06a8c4" stop-opacity="0" />
      <stop offset="0.35" stop-color="#22c8e0" stop-opacity="0.55" />
      <stop offset="1" stop-color="#5fdcee" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="laneModel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d55d1" stop-opacity="0" />
      <stop offset="1" stop-color="#ad9cf6" stop-opacity="0.7" />
    </linearGradient>
  </defs>

  <!-- Ground -->
  <rect width="1200" height="630" fill="#05070b" />
  <rect width="1200" height="630" fill="url(#lattice)" mask="url(#latticeMask)" opacity="0.5" />

  <!-- The right-hand data lanes. Four layers converging: source, warehouse,
       reporting, semantic. Abstract, and deliberately not a chart. -->
  <g transform="translate(690 118)" fill="none" stroke-linecap="round">
    <path d="M0 30 C120 30 150 120 300 120" stroke="url(#lane)" stroke-width="2.5" />
    <path d="M0 100 C130 100 140 120 300 120" stroke="url(#lane)" stroke-width="2.5" />
    <path d="M0 170 C120 170 160 122 300 120" stroke="url(#lane)" stroke-width="2.5" />
    <path d="M0 240 C110 240 170 126 300 120" stroke="url(#lane)" stroke-width="2.5" />
    <path d="M300 120 C360 120 380 210 440 210" stroke="url(#laneModel)" stroke-width="2.5" />
    <path d="M300 120 C360 120 380 34 440 34" stroke="url(#laneModel)" stroke-width="2.5" />

    <!-- Layer nodes -->
    <g fill="#080b11" stroke="#22c8e0" stroke-width="2">
      <rect x="-8" y="20" width="20" height="20" rx="4" />
      <rect x="-8" y="90" width="20" height="20" rx="4" />
      <rect x="-8" y="160" width="20" height="20" rx="4" />
      <rect x="-8" y="230" width="20" height="20" rx="4" />
    </g>
    <!-- The governed-model node: the point everything resolves through. -->
    <circle cx="300" cy="120" r="15" fill="#06323d" stroke="#5fdcee" stroke-width="2.5" />
    <circle cx="300" cy="120" r="5" fill="#5fdcee" stroke="none" />
    <g fill="#241a4a" stroke="#ad9cf6" stroke-width="2">
      <rect x="432" y="26" width="17" height="17" rx="3.5" />
      <rect x="432" y="202" width="17" height="17" rx="3.5" />
    </g>
  </g>

  <!-- Alignment marks, top left. A blueprint annotation, not decoration for its
       own sake: it marks the content's left edge and cap height. -->
  <g stroke="#2f3a4d" stroke-width="1">
    <path d="M72 60 V78 M72 60 H90" />
    <path d="M1128 570 V552 M1128 570 H1110" />
  </g>

  <!-- Identity lockup -->
  <g transform="translate(72 96)">
    <g transform="scale(1.35)">
      <g fill="#5fdcee" opacity="0.42">
        <circle cx="6" cy="6" r="1.15"/><circle cx="16" cy="6" r="1.15"/><circle cx="26" cy="6" r="1.15"/>
        <circle cx="6" cy="16" r="1.15"/><circle cx="26" cy="16" r="1.15"/>
        <circle cx="6" cy="26" r="1.15"/><circle cx="16" cy="26" r="1.15"/><circle cx="26" cy="26" r="1.15"/>
      </g>
      <g fill="none" stroke="#5fdcee" stroke-width="2.6" stroke-linecap="square" stroke-linejoin="miter">
        <path d="M6 27 L16 5 L26 27"/><path d="M10.4 18.4 H21.6"/>
      </g>
      <circle cx="16" cy="5" r="2.4" fill="#5fdcee"/>
    </g>
    <text x="58" y="34" fill="#f2f6fc" font-family="'Space Grotesk',ui-sans-serif,system-ui,sans-serif" font-size="30" font-weight="700" letter-spacing="-0.6">ARPI</text>
  </g>

  <!-- Headline -->
  <text x="72" y="248" fill="#f2f6fc" font-family="'Space Grotesk',ui-sans-serif,system-ui,sans-serif" font-size="55" font-weight="600" letter-spacing="-1.6">Automotive Retail</text>
  <text x="72" y="310" fill="#f2f6fc" font-family="'Space Grotesk',ui-sans-serif,system-ui,sans-serif" font-size="55" font-weight="600" letter-spacing="-1.6">Performance Intelligence</text>

  <!-- Positioning line -->
  <text x="72" y="362" fill="#b3bfd4" font-family="ui-sans-serif,system-ui,'Segoe UI',sans-serif" font-size="21">One governed view of dealership performance.</text>

  <!-- Stack. Pill widths are sized to the monospace advance at this size
       (12.5px + 1px tracking, ~8.5px per character) plus 18px of padding each
       side, so no label can overrun its container. -->
  <g font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12.5" letter-spacing="1">
    <rect x="72" y="396" width="147" height="30" rx="15" fill="#0b0f16" stroke="#232c3c"/>
    <text x="90" y="416" fill="#8b99b3">POSTGRESQL 16</text>
    <rect x="231" y="396" width="215" height="30" rx="15" fill="#0b0f16" stroke="#232c3c"/>
    <text x="249" y="416" fill="#8b99b3">POWER BI · TMDL · DAX</text>
    <rect x="458" y="396" width="130" height="30" rx="15" fill="#0b0f16" stroke="#232c3c"/>
    <text x="476" y="416" fill="#8b99b3">PYTHON 3.11</text>
  </g>

  <!-- The synthetic-data statement. Given a bordered panel and warm accent
       rather than being tucked into a corner, because it is the single most
       important qualifier on the image. -->
  <g>
    <rect x="72" y="466" width="700" height="60" rx="10" fill="#3d2a05" fill-opacity="0.4" stroke="#eaab2c" stroke-opacity="0.45"/>
    <text x="94" y="492" fill="#f7c96a" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="600">Synthetic data only. Granite Auto Group is fictional.</text>
    <text x="94" y="513" fill="#fcdfa4" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5">No real dealership, customer, employee or lending data exists in this project.</text>
  </g>

  <!-- Author, on the baseline rule -->
  <path d="M72 566 H1128" stroke="#1a212e" stroke-width="1"/>
  <text x="72" y="592" fill="#8b99b3" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15">Michael Palmer</text>
  <text x="1128" y="592" text-anchor="end" fill="#64748f" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12.5" letter-spacing="0.8">PORTFOLIO DATA PLATFORM · MIT</text>
</svg>
